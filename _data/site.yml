  title: What we do
  tags_label: Technologies

work:
  id: work
  eyebrow: 02 / Work
  title: Things we have built
  sub: A short list, deliberately. Each of these shipped and ran in production.

process:
  id: process
  eyebrow: 03 / Process
  title: How this goes
  steps:
    - label: STEP 1
      title: A week to get specific.
      body: "We start with a short paid discovery: the real constraints, the riskiest assumption, and what shipping actually means. You end up with a plan you could hand to anyone."
    - label: STEP 2
      title: Short cycles, working software.
      body: Two-week cycles, something usable at the end of each one. You see progress in the product, not in a status report.
    - label: STEP 3
      title: We leave it maintainable.
      body: Tests, documentation, deployment, handover. The goal is a team that does not need us and calls us anyway.

about:
  id: about
  eyebrow: 04 / About
  title: Who you are talking to
  lead: aissac is a small studio, and small is the point. The person who takes your first call is the person who writes the code. No account manager, no handoff to a junior team, no layer between you and the work.
  founder:
    paragraphs:
      - "I have been building software for twenty years: first for US startups, with an engineering team I put together here in Romania, then for eight years in the UK, for companies like notonthehighstreet.com and Builder.ai. I came back to Cluj and now I build software products for people who need the thing to actually work."
      - If you are weighing a studio against hiring, I am happy to tell you which one you need, even when it is not me.
    signature: Istvan
    link:
      label: CV and background at ihoka.me
      url: https://ihoka.me
    headshot:
      src: /assets/img/istvan.jpg # to be supplied
      alt: Istvan
      width: 240
      height: 300

contact:
  id: contact
  eyebrow: 05 / Contact
  title: Start a project
  sub: Tell us roughly what you have in mind. A paragraph is plenty. We reply within one working day.
  optional: (optional)
  fields:
    name: Name
    email: Email
    company: Company
    topic: What is this about
    message: Message
  topic_placeholder: Choose one # options are the service titles from services.yml
  submit: Send
  sending: Sending
  retry: Try again
  errors:
    name: Enter your name so we know who to reply to. # PROPOSED, not in spec or boards: confirm
    email: Enter a full email address, like name@company.com.
    message: Write a sentence or two so we know where to start.
  network_error:
    title: Your message did not send.
    body: "Nothing is lost, it is all still in the form. Try again, or email directly:"
  aside:
    label: Other ways to reach us
    email_label: Email
    based_in_label: Based in
    next_heading: WHAT HAPPENS NEXT
    next_body: Within one working day you hear back from the person who would write the code, with a few questions and a time to talk.

