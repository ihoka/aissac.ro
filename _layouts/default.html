<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title | default: site.data.site.meta.title }}</title>
    {%- assign description = page.description | default: site.data.site.meta.description -%}
    {%- if description %}
    <meta name="description" content="{{ description | escape }}">
    {%- endif %}
    <link rel="canonical" href="{{ page.url | absolute_url }}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;500&family=Atkinson+Hyperlegible+Next:wght@400;500;700&family=Big+Shoulders:wght@600;700;800&family=Big+Shoulders+Stencil:wght@800&display=swap">

    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
    {%- feed_meta %}
  </head>
  <body>
    {{ content }}
  </body>
</html>
