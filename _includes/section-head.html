{%- comment -%} Eyebrow plus h2. Params: section (data hash with id, eyebrow, title). {%- endcomment -%}
<div class="flex flex-col gap-3">
  <p class="eyebrow m-0">{{ include.section.eyebrow }}</p>
  <h2 id="{{ include.section.id }}-title" class="m-0 font-display text-h2 font-extrabold">{{ include.section.title }}</h2>
</div>
