{%- assign t = site.data.site.track_record -%}
<section aria-label="{{ t.label }}" class="border-y border-rule bg-surface">
  <div class="container-site flex flex-col gap-5 py-10 lg:flex-row lg:flex-wrap lg:items-center lg:gap-x-16 lg:gap-y-6 lg:py-12">
    <p class="m-0 max-w-[440px] text-intro text-text-2 lg:flex-[1_1_340px]">{{ t.text }}</p>
    <ul class="m-0 flex list-none flex-wrap items-baseline gap-x-3 gap-y-0.5 p-0 font-display text-clients font-bold text-text lg:flex-[1_1_560px] lg:gap-x-[18px] lg:gap-y-1.5" role="list">
      {%- for client in t.clients %}
      <li>{{ client }}</li>
      {%- unless forloop.last %}<li aria-hidden="true" class="text-border">{{ site.data.site.glyphs.separator }}</li>{% endunless %}
      {%- endfor %}
    </ul>
  </div>
</section>
