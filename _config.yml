# Site configuration. Copy lives in _data/, not here.
url: "https://aissac.ro"
baseurl: ""
lang: en

# Public integration settings (not secrets). Filled in at step 5 and 6.
contact_endpoint: ""        # Cloudflare Worker URL, e.g. https://contact.aissac.ro/contact
turnstile_site_key: "0x4AAAAAAFww-hULDFY11sCy" # public Turnstile site key
turnstile_action: "contact"  # must match TURNSTILE_ACTION in worker/wrangler.toml
cf_analytics_token: ""      # Cloudflare Web Analytics beacon token

markdown: kramdown
permalink: pretty

plugins:
  - jekyll-feed

# Blog plumbing stays in place but publishes nothing at launch.
feed:
  path: feed.xml

# The Tailwind entry file is compiled by the Tailwind CLI to assets/css/site.css
# before Jekyll runs; Jekyll copies only the compiled output.
exclude:
  - assets/css/main.css
  - tailwind.config.js
  - package.json
  - package-lock.json
  - node_modules
  - worker
  - docs
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - .ruby-version

keep_files:
  - CNAME
