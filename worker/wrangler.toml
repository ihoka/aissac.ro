name = "aissac-contact"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

# Public, non-secret settings. Secrets are set with:
#   npx wrangler secret put TURNSTILE_SECRET
#   npx wrangler secret put RESEND_API_KEY
[vars]
SITE_URL = "https://aissac.ro"
ALLOWED_ORIGINS = "https://aissac.ro,https://www.aissac.ro"
MAIL_FROM = "aissac <office@aissac.ro>"
MAIL_TO = "office@aissac.ro"
# Turnstile: siteverify must return this action and one of these frontend
# hostnames. Production only: never add localhost or 127.0.0.1 here.
TURNSTILE_ACTION = "contact"
TURNSTILE_HOSTNAMES = "aissac.ro,www.aissac.ro"

# Per-IP rate limits. The binding supports 10 or 60 second windows.
[[ratelimits]]
name = "CONTACT_LIMIT"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# Tighter limit for no-JS posts, which carry no Turnstile token.
[[ratelimits]]
name = "UNVERIFIED_LIMIT"
namespace_id = "1002"
simple = { limit = 2, period = 60 }
